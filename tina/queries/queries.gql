query globalQuery($relativePath: String!) {
  global(relativePath: $relativePath) {
    hero {
      eyebrow
      tagline1
      tagline2
      cta1Label
      cta1Href
      cta2Label
      cta2Href
    }
    about {
      headingLine1
      headingLine2
      bio
      stats { value label }
      socials { name handle url }
      resumeUrl
    }
    certifications {
      items {
        name
        fullName
        issuer
        year
        image
        credlyUrl
      }
    }
    contact {
      heading
      intro
      responseTime
    }
  }
}

query postListQuery {
  postConnection {
    edges {
      node {
        id
        title
        category
        publishedAt
        readTime
        description
        _sys {
          filename
        }
      }
    }
  }
}

query postQuery($relativePath: String!) {
  post(relativePath: $relativePath) {
    ...PostParts
  }
}

query categoryListQuery {
  categoryConnection {
    edges {
      node {
        id
        name
        description
        color
        _sys {
          filename
        }
      }
    }
  }
}
